<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EcoGuia · Central do funcionário</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff.css">
</head>
<body>

<!-- Entrada -->
<main id="gate" class="gate">
  <form id="loginForm" class="gate-card" autocomplete="on">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#3ddc97" stroke-width="2"/><path d="M8 14c0-3.5 2.2-5.5 6.5-5.5 0 4.2-2.2 6.5-5.5 6.5z" fill="#3ddc97"/></svg><span>Eco<i>Guia</i></span></div>
    <span class="tag warn">Área restrita</span>
    <h1>Central do funcionário</h1>
    <p class="mu">Acesso somente para a equipe autorizada.</p>
    <label class="fl">E-mail<input id="lEmail" type="email" required autocomplete="username"></label>
    <label class="fl">Senha<input id="lSenha" type="password" required minlength="8" maxlength="72" autocomplete="current-password"></label>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn" id="lGo" type="submit">Entrar</button>
  </form>
</main>

<!-- Painel -->
<div id="app" hidden>
  <header class="bar">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#3ddc97" stroke-width="2"/><path d="M8 14c0-3.5 2.2-5.5 6.5-5.5 0 4.2-2.2 6.5-5.5 6.5z" fill="#3ddc97"/></svg><span>Eco<i>Guia</i></span><span class="tag warn">Central</span></div>
    <div class="who"><span id="uNome" class="mu"></span><button class="btn alt sm" id="sair" type="button">Sair</button></div>
  </header>
  <div class="layout">
    <nav class="side" id="tabs" aria-label="Seções da central">
      <button data-v="geral" class="on">Visão geral</button>
      <button data-v="lixeiras">Lixeiras e leituras</button>
      <button data-v="clientes">Clientes</button>
      <button data-v="descartes">Descartes</button>
      <button data-v="pontos">Pontos de coleta</button>
      <button data-v="recompensas">Recompensas</button>
    </nav>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="staff.js"></script>
</body>
</html>
